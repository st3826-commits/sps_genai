[project]
name = "sps-genai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "beijingshiya-a11y", email = "beijingshiya@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "spacy>=3.8.16",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
sps-genai = "sps_genai:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
